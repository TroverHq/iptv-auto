name: iptv-auto-update

# 每天两次：UTC 13:30 / 01:30 = 北京时间 21:30 / 09:30
on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"
    - cron: "30 1 * * *"

permissions:
  contents: read

concurrency:
  group: iptv-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # C2: 拉取仓库代码（scripts/clean_iptv.py 在 repo 里，runner 工作区不 checkout 看不到）
      - name: Checkout
        uses: actions/checkout@v4

      - name: 启动 akiralereal/iptv 容器
        run: |
          docker run -d --name iptv \
            -p 1905:1905 \
            -e mport=1905 \
            -e mbrowserConcurrency=1 \
            -e TZ=Asia/Shanghai \
            -v "$HOME/iptv-data:/iptv/data" \
            akiralereal/iptv:latest
          for i in $(seq 1 60); do
            if curl -sf -m 5 http://127.0.0.1:1905/ -o /dev/null; then
              echo "web ok"
              break
            fi
            sleep 5
          done

      - name: 等待聚合完成并抓取输出
        run: |
          mkdir -p out
          ok=0
          # 最多等 75 分钟（50*90s），期间每 90s 探一次 /txt 是否已产出 #genre# 列表
          for i in $(seq 1 50); do
            body=$(curl -s -m 30 http://127.0.0.1:1905/txt || true)
            if [ -n "$body" ] && echo "$body" | grep -q "#genre#"; then
              echo "$body" > out/iptv.json
              ok=1
              echo "READY at iter $i"
              break
            fi
            sleep 90
          done
          if [ "$ok" != "1" ]; then
            echo "::error::容器 75 分钟内未产出频道列表"
            curl -s -m 30 http://127.0.0.1:1905/admin -o out/admin_dump.html || true
            exit 1
          fi
          curl -s -m 60 http://127.0.0.1:1905/interface.m3u -o out/iptv_auto.m3u || true
          curl -s -m 60 http://127.0.0.1:1905/playback.xml -o out/epg.xml || true
          wc -c out/*
          echo "===== TXT 前 40 行（分组预览） ====="
          head -40 out/iptv.json

      # 首跑/排查用：在 Actions 运行页下载产物，人工确认内容质量
      - name: 上传产物（Actions 页可下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-output
          path: out/
          retention-days: 14

      - name: 整理（剔除本机代理地址 + 统一分类）
        run: python3 scripts/clean_iptv.py

      - name: 推送到 Gitee（新建文件，不覆盖 channels.json）
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          git config --global user.name "iptv-auto"
          git config --global user.email "iptv-auto@actions.local"
          git clone "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" repo
          cd repo
          cp ../out/iptv.json ./iptv.json
          # 需要的话一并维护（先保持最小改动，注释掉）：
          # cp ../out/iptv_auto.m3u ./iptv_auto.m3u
          # cp ../out/epg.xml ./epg.xml
          if git diff --quiet -- iptv.json; then
            echo "内容无变化，跳过提交"
          else
            git add iptv.json
            git commit -m "auto: iptv list update $(date -u '+%F %T')"
            git push "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" HEAD
          fi
